<!DOCTYPE html>
<html>
<head>
  <title>Prakriti Data Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🧘 Prakriti Data Collection</h1>
  <p class="subtitle">Ayurvedic Constitution Research Study</p>

  <!-- PERSONAL DETAILS -->
  <div class="card">
    <h2>👤 Personal Information</h2>
    <div class="form-row">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="number" id="age" placeholder="Age" required>
    </div>
  </div>

<!-- CAMERA -->
<div class="card">
  <h2>📸 Face Capture</h2>

  <div class="camera-box">
    
    <div class="camera-container">
      
      <!-- VIDEO -->
      <video id="video" autoplay playsinline></video>

      <!-- FACE SHAPE OVERLAY (SVG) -->
      <svg class="face-overlay" viewBox="0 0 300 400" preserveAspectRatio="none">
        <path d="
          M150,35
          C110,35 80,55 65,95
          C55,115 50,140 55,160
      
          C55,210 75,260 110,300
          C120,315 135,330 150,340
          C165,330 180,315 190,300
          C225,260 245,210 245,160
      
          C250,140 245,115 235,95
          C220,55 190,35 150,35
          Z
        "/>
      </svg>

    </div>

    <!-- CAPTURED IMAGE -->
    <img id="photoPreview">

    <!-- CANVAS -->
    <canvas id="canvas" hidden></canvas>

  </div>

  <!-- CONTROLS -->
  <div class="camera-controls center">
    <button class="primary-btn" onclick="startCamera()">Start Camera</button>
    <button class="secondary-btn" onclick="switchCamera()">Switch Camera</button>
    <button id="captureBtn" class="secondary-btn" onclick="capture()" hidden>
      Capture
    </button>
  </div>

  <!-- INSTRUCTION -->
  <p style="text-align:center; color:#0f766e; margin-top:10px;">
    Align your face inside the outline before capturing
  </p>

</div>

  <!-- QUESTIONS -->
  <div class="card">
    <h2>📝 Questionnaire</h2>
    <div id="questions"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-area">
    <button class="submit-btn" onclick="submitForm()">Submit Data</button>
  </div>

  <!-- RESULT -->
  <div class="card result-card" id="resultCard" style="display:none;">
    <h2>✅ Submission Status</h2>
    <div class="result-box" id="result"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>

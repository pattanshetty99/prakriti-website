<!DOCTYPE html>
<html>
<head>
  <title>Prakriti Data Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🧘 Prakriti Data Collection</h1>
  <p class="subtitle">Ayurvedic Constitution Research Study</p>

  <!-- PERSONAL DETAILS -->
  <div class="card">
    <h2>👤 Personal Information</h2>
    <div class="form-row">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="number" id="age" placeholder="Age" required>
    </div>
  </div>

<!-- CAMERA -->
<div class="card">
  <h2>📸 Face Capture</h2>

  <div class="camera-box">
    
    <div class="camera-container">
      
      <!-- VIDEO -->
      <video id="video" autoplay playsinline></video>

      <!-- FACE SHAPE OVERLAY (SVG) -->
      <svg class="face-overlay" viewBox="0 0 500 600" preserveAspectRatio="none">
        <!-- Head shape -->
        <path
          d="
            M250,55
            C210,55 175,70 155,100
            C135,130 125,165 125,200
            C123,192 112,195 108,208
            C103,223 105,245 118,252
            C118,260 119,268 121,276
            C125,320 140,370 165,405
            C185,435 215,458 250,468
            C285,458 315,435 335,405
            C360,370 375,320 379,276
            C381,268 382,260 382,252
            C395,245 397,223 392,208
            C388,195 377,192 375,200
            C375,165 365,130 345,100
            C325,70 290,55 250,55 Z
          "
          fill="none" stroke="white" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"
        />
        <!-- Left ear detail -->
        <path d="M118,252 C112,258 110,268 113,278 C116,286 120,290 125,288"
          fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <!-- Right ear detail -->
        <path d="M382,252 C388,258 390,268 387,278 C384,286 380,290 375,288"
          fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <!-- Neck left -->
        <path d="M215,462 C212,480 210,500 208,520"
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Neck right -->
        <path d="M285,462 C288,480 290,500 292,520"
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>

    </div>

    <!-- CAPTURED IMAGE -->
    <img id="photoPreview">

    <!-- CANVAS -->
    <canvas id="canvas" hidden></canvas>

  </div>

  <!-- CONTROLS -->
  <div class="camera-controls center">
    <button class="primary-btn" onclick="startCamera()">Start Camera</button>
    <button class="secondary-btn" onclick="switchCamera()">Switch Camera</button>
    <button id="captureBtn" class="secondary-btn" onclick="capture()" hidden>
      Capture
    </button>
  </div>

  <!-- INSTRUCTION -->
  <p style="text-align:center; color:#0f766e; margin-top:10px;">
    Align your face inside the outline before capturing
  </p>

</div>

  <!-- QUESTIONS -->
  <div class="card">
    <h2>📝 Questionnaire</h2>
    <div id="questions"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-area">
    <button class="submit-btn" onclick="submitForm()">Submit Data</button>
  </div>

  <!-- RESULT -->
  <div class="card result-card" id="resultCard" style="display:none;">
    <h2>✅ Submission Status</h2>
    <div class="result-box" id="result"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>

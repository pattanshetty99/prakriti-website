<!DOCTYPE html>
<html>
<head>
  <title>Prakriti Data Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>🧘 Prakriti Data Collection</h1>
  <p class="subtitle">Ayurvedic Constitution Research Study</p>

  <!-- PERSONAL DETAILS -->
  <div class="card">
    <h2>👤 Personal Information</h2>
    <div class="form-row">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="number" id="age" placeholder="Age" required>
    </div>
    
    <div class="form-row">
      <input type="number" id="height" placeholder="Height (cm)" required>
      <input type="number" id="weight" placeholder="Weight (kg)" required>
    </div>
  </div>

  <!-- CAMERA -->
  <div class="card">
    <h2>📸 Face Capture</h2>
    <div class="camera-box">
      <div class="camera-container">

        <!-- VIDEO -->
        <video id="video" autoplay playsinline></video>

        <!-- FACE SHAPE OVERLAY (SVG) -->
        <svg class="face-overlay" viewBox="0 0 200 240" preserveAspectRatio="none">
          <path d="M100,30 C82,30 66,42 58,62 C50,80 50,100 50,114 C47,110 41,112 39,120 C36,130 38,145 47,150 C50,164 56,180 66,193 C76,204 88,210 100,212 C112,210 124,204 134,193 C144,180 150,164 153,150 C162,145 164,130 161,120 C159,112 153,110 150,114 C150,100 150,80 142,62 C134,42 118,30 100,30 Z"/>
        </svg>

        <!-- CAPTURED IMAGE -->
        <img id="photoPreview">

      </div>
      <!-- CANVAS -->
      <canvas id="canvas" hidden></canvas>
    </div>

    <!-- CONTROLS -->
    <div class="camera-controls center">
      <button class="primary-btn" onclick="startCamera()">Start Camera</button>
      <button class="secondary-btn" onclick="switchCamera()">Switch Camera</button>
      <button id="captureBtn" class="secondary-btn" onclick="capture()" hidden>Capture</button>
    </div>

    <!-- INSTRUCTION -->
    <p style="text-align:center; color:#0f766e; margin-top:10px;">
      Align your face inside the outline before capturing
    </p>
  </div>

  <!-- QUESTIONS -->
  <div class="card">
    <h2>📝 Questionnaire</h2>
    <div id="questions"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-area">
    <button class="submit-btn" onclick="submitForm()">Submit Data</button>
  </div>

  <!-- RESULT -->
  <div class="card result-card" id="resultCard" style="display:none;">
    <h2>✅ Submission Status</h2>
    <div class="result-box" id="result"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>

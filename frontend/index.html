<!DOCTYPE html>
<html>
<head>
  <title>Prakriti Data Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🧘 Prakriti Data Collection</h1>
  <p class="subtitle">Ayurvedic Constitution Research Study</p>

  <!-- PERSONAL DETAILS -->
  <div class="card">
    <h2>👤 Personal Information</h2>
    <div class="form-row">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="number" id="age" placeholder="Age" required>
    </div>
  </div>

<!-- CAMERA -->
<div class="card">
  <h2>📸 Face Capture</h2>

  <div class="camera-box">
    
    <div class="camera-container">
      
      <!-- VIDEO -->
      <video id="video" autoplay playsinline></video>

      <!-- FACE SHAPE OVERLAY (SVG) -->
      <svg class="face-overlay" viewBox="0 0 200 260" preserveAspectRatio="none">
        <!-- Head -->
        <path
          d="
            M100,14
            C78,14 62,24 53,42
            C44,60 42,80 42,96
            C39,92 32,94 30,103
            C27,114 29,130 38,135
            C39,142 40,150 42,158
            C46,183 58,206 74,222
            C84,232 92,238 100,240
            C108,238 116,232 126,222
            C142,206 154,183 158,158
            C160,150 161,142 162,135
            C171,130 173,114 170,103
            C168,94 161,92 158,96
            C158,80 156,60 147,42
            C138,24 122,14 100,14 Z
          "
        />
        <!-- Left ear detail -->
        <path d="M38,135 C34,140 33,148 35,155 C37,161 40,164 43,162"/>
        <!-- Right ear detail -->
        <path d="M162,135 C166,140 167,148 165,155 C163,161 160,164 157,162"/>
        <!-- Neck left -->
        <path d="M84,238 C82,246 81,254 80,262"/>
        <!-- Neck right -->
        <path d="M116,238 C118,246 119,254 120,262"/>
      </svg>

    </div>

    <!-- CAPTURED IMAGE -->
    <img id="photoPreview">

    <!-- CANVAS -->
    <canvas id="canvas" hidden></canvas>

  </div>

  <!-- CONTROLS -->
  <div class="camera-controls center">
    <button class="primary-btn" onclick="startCamera()">Start Camera</button>
    <button class="secondary-btn" onclick="switchCamera()">Switch Camera</button>
    <button id="captureBtn" class="secondary-btn" onclick="capture()" hidden>
      Capture
    </button>
  </div>

  <!-- INSTRUCTION -->
  <p style="text-align:center; color:#0f766e; margin-top:10px;">
    Align your face inside the outline before capturing
  </p>

</div>

  <!-- QUESTIONS -->
  <div class="card">
    <h2>📝 Questionnaire</h2>
    <div id="questions"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-area">
    <button class="submit-btn" onclick="submitForm()">Submit Data</button>
  </div>

  <!-- RESULT -->
  <div class="card result-card" id="resultCard" style="display:none;">
    <h2>✅ Submission Status</h2>
    <div class="result-box" id="result"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Prakriti Data Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🧘 Prakriti Data Collection</h1>
  <p class="subtitle">Ayurvedic Constitution Research Study</p>

  <!-- PERSONAL DETAILS -->
  <div class="card">
    <h2>👤 Personal Information</h2>
    <div class="form-row">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="number" id="age" placeholder="Age" required>
    </div>
  </div>

<!-- CAMERA -->
<div class="card">
  <h2>📸 Face Capture</h2>

  <div class="camera-box">
    
    <div class="camera-container">
      
      <!-- VIDEO -->
      <video id="video" autoplay playsinline></video>

      <!-- FACE SHAPE OVERLAY (SVG) -->
      <svg class="face-overlay" viewBox="0 0 500 600" preserveAspectRatio="none">
        <path d="
          M250,60
          C180,60 130,100 110,170
          C90,180 85,210 105,225
      
          C105,300 140,370 190,420
          C210,440 230,460 250,470
          C270,460 290,440 310,420
          C360,370 395,300 395,225
      
          C415,210 410,180 390,170
          C370,100 320,60 250,60
      
          M110,170
          C120,180 135,200 135,220
          C135,250 125,280 120,300
      
          M390,170
          C380,180 365,200 365,220
          C365,250 375,280 380,300
        " />
      </svg>

    </div>

    <!-- CAPTURED IMAGE -->
    <img id="photoPreview">

    <!-- CANVAS -->
    <canvas id="canvas" hidden></canvas>

  </div>

  <!-- CONTROLS -->
  <div class="camera-controls center">
    <button class="primary-btn" onclick="startCamera()">Start Camera</button>
    <button class="secondary-btn" onclick="switchCamera()">Switch Camera</button>
    <button id="captureBtn" class="secondary-btn" onclick="capture()" hidden>
      Capture
    </button>
  </div>

  <!-- INSTRUCTION -->
  <p style="text-align:center; color:#0f766e; margin-top:10px;">
    Align your face inside the outline before capturing
  </p>

</div>

  <!-- QUESTIONS -->
  <div class="card">
    <h2>📝 Questionnaire</h2>
    <div id="questions"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-area">
    <button class="submit-btn" onclick="submitForm()">Submit Data</button>
  </div>

  <!-- RESULT -->
  <div class="card result-card" id="resultCard" style="display:none;">
    <h2>✅ Submission Status</h2>
    <div class="result-box" id="result"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>

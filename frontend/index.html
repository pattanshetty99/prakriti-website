<!DOCTYPE html>
<html>
<head>
  <title>Prakriti Data Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🧘 Prakriti Data Collection</h1>
  <p class="subtitle">Ayurvedic Constitution Research Study</p>

  <!-- PERSONAL DETAILS -->
  <div class="card">
    <h2>👤 Personal Information</h2>
    <div class="form-row">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="number" id="age" placeholder="Age" required>
    </div>
  </div>

  <!-- CAMERA -->
  <div class="card">
    <h2>📸 Face Capture</h2>

    <div class="camera-box">
      <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    
        <!-- FACE OUTLINE -->
        <div class="face-overlay"></div>
      </div>
    
      <img id="photoPreview">
      <canvas id="canvas" hidden></canvas>
    </div>

    <div class="camera-controls center">
      <button class="primary-btn" onclick="startCamera()">Start Camera</button>
      <button class="secondary-btn" onclick="switchCamera()">Switch Camera</button>
      <button id="captureBtn" class="secondary-btn" onclick="capture()" hidden>
        Capture
      </button>
    </div>
  </div>

  <!-- QUESTIONS -->
  <div class="card">
    <h2>📝 Questionnaire</h2>
    <div id="questions"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-area">
    <button class="submit-btn" onclick="submitForm()">Submit Data</button>
  </div>

  <!-- RESULT -->
  <div class="card result-card" id="resultCard" style="display:none;">
    <h2>✅ Submission Status</h2>
    <div class="result-box" id="result"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
